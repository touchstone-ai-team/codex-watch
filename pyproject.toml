[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-watchdog"
version = "0.1.1"
description = "One-command tmux watchdog launcher for long-running Codex CLI sessions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Touchstone" }
]
license = { text = "MIT" }
keywords = ["codex", "tmux", "watchdog", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
  "Topic :: Terminals",
]
dependencies = []

[project.scripts]
codex-watch = "codex_watchdog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_watchdog = ["bundled/watch-codex-session.sh"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
